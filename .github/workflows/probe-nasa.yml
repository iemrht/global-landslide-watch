name: Probe NASA LHASA

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: A viewer image and script paths
        run: |
          curl -sSL -m 60 -o v.html https://pmmpublisher.pps.eosdis.nasa.gov/swagger/index.html
          grep -oE '(src|href)="[^"]+"' v.html | grep -vE '\.css' | sort -u | head -40
          echo "----- png / data urls"
          grep -oE "[\"'][^\"' ]*(\.png|\.json|\.tif|gpmweb|pmmpublisher|/pub/)[^\"' ]*[\"']" v.html | sort -u | head -40
      - name: B landslides.nasa.gov viewer
        run: |
          curl -sSL -m 60 -o lv.html -w "HTTP %{http_code} -> %{url_effective}\n" https://landslides.nasa.gov/viewer/ || true
          grep -oE "(webmap|appid|id)=[0-9a-f]{32}|[0-9a-f]{32}|https?://[^\"' ]*(arcgis|MapServer|ImageServer|FeatureServer)[^\"' ]*" lv.html | sort -u | head -30 || true
          for id in $(grep -oE '[0-9a-f]{32}' lv.html | sort -u | head -3); do
            echo "===== item $id"
            curl -sSL -m 60 "https://www.arcgis.com/sharing/rest/content/items/$id/data?f=json" | grep -oE 'https?://[^"]*(Server|services)[^"]*' | sort -u | head -20 || true
          done
      - name: C NASA disasters NRT services
        run: |
          curl -sSL -m 60 "https://maps.disasters.nasa.gov/ags03/rest/services/NRT?f=json" | head -c 3000; echo
          echo "===== landslide_nowcast info"
          curl -sSL -m 60 "https://maps.disasters.nasa.gov/ags03/rest/services/NRT/landslide_nowcast/ImageServer?f=json" | grep -oE '"(timeInfo|timeExtent|pixelType|extent|minValues|maxValues)"[^]]*\]' | head -10 || true
          echo "===== latest rasters"
          curl -sSL -m 60 "https://maps.disasters.nasa.gov/ags03/rest/services/NRT/landslide_nowcast/ImageServer/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=5&f=json" | head -c 2000; echo
