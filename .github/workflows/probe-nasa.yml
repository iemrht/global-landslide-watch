name: Probe NASA LHASA

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Viewer scripts
        run: |
          base=https://pmmpublisher.pps.eosdis.nasa.gov/swagger
          curl -sSL -m 60 -o viewer.html "$base/index.html"
          grep -oE 'src="[^"]+\.js[^"]*"' viewer.html | sed 's/src="//;s/"$//' | sort -u > scripts.txt
          cat scripts.txt
          mkdir -p js
          while read -r s; do
            case "$s" in http*) u="$s";; /*) u="https://pmmpublisher.pps.eosdis.nasa.gov$s";; *) u="$base/$s";; esac
            curl -sSL -m 60 -o "js/$(basename "${s%%\?*}")" "$u" || true
          done < scripts.txt
          ls -la js
      - name: Landslide URLs in scripts
        run: |
          grep -ohE "[\"'][^\"' ]*(landslide|nowcast|lhasa|\.tif|\.nc4)[^\"' ]*[\"']" viewer.html js/*.js | sort -u | head -80 || true
      - name: Landslide code context
        run: |
          grep -n -iE "landslide|nowcast" js/*.js viewer.html | grep -iE "url|http|tif|nc4|href|download|\+" | cut -c1-400 | head -60 || true
